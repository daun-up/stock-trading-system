spring:
  application:
    name: stock-trading-system
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_trading_system
    username: trading
    password: trading
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
